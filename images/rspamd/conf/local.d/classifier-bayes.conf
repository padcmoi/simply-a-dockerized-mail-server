backend = "redis";
servers = "mail-redis:6379";
new_schema = true;
expire = 8640000;
autolearn = true;

# Per-recipient bayes: each user has their own statistics under
# BAYES_HAM_<user>/BAYES_SPAM_<user> Redis keys so a per-user "drag-to-Junk"
# trains only that user's classifier without polluting global counters.
users_redis_users {
  selector = "rcpt:addr";
}
per_user = true;
