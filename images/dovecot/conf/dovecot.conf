# =============================================================================
# Dovecot main config
# =============================================================================

protocols = imap lmtp sieve
listen = *

log_path      = /var/log/mail/dovecot.log
info_log_path = /var/log/mail/dovecot.log
debug_log_path = /var/log/mail/dovecot.log

mail_uid              = vmail
mail_gid              = vmail
mail_privileged_group = vmail
first_valid_uid       = 5000
last_valid_uid        = 5000

ssl_min_protocol = TLSv1.2

# Name dovecot writes wherever it identifies itself (bounces, reports),
# instead of the container id docker gives as the default hostname.
hostname = ${MAIL_HOSTNAME}

# Postfix hands every inbound mail to dovecot over LMTP inside the docker
# network. By default dovecot stamps that internal hop with its own
# Received header, exposing the postfix container IP (172.200.0.x) and the
# container id. The hop never leaves the machine and the dovecot log keeps
# a trace of each LMTP delivery, so the topmost Received header of a mail
# is the one postfix writes as mail.<domain> with the sender's real IP.
lmtp_add_received_header = no

# Pigeonhole sieve actions (reject, redirect, vacation, notify) submit
# outgoing mail via SMTP to postfix instead of trying a local sendmail
# binary (which does not exist in the Alpine dovecot image).
submission_host = mail-postfix:10025

!include conf.d/*.conf
