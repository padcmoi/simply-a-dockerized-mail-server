service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
  user = vmail
}

service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
  # SASL listener for postfix (smtpd_sasl_path = inet:dovecot:12345).
  inet_listener auth-client {
    port = 12345
  }
}

service auth-worker {
  user = vmail
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# Quota policy listener for postfix smtpd_recipient_restrictions
# (check_policy_service inet:dovecot:12340).
service quota-status {
  executable = quota-status -p postfix
  inet_listener {
    port = 12340
  }
  client_limit = 1
}

service dict {
  unix_listener dict {
    mode = 0600
    user = vmail
  }
}
