protocol sieve {
  managesieve_logout_format = bytes=%i/%o
}

# Port 4190 is bound to the internal docker network only (no host port mapping),
# so allowing PLAIN auth here is safe. Roundcube can authenticate without
# STARTTLS handshake gymnastics over the local bridge.
remote 172.200.0.0/24 {
  disable_plaintext_auth = no
}
