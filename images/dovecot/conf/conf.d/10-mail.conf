# Maildir layout matches v1 exactly: /var/mail/vhosts/<domain>/<user>/
# Default Maildir++ layout (folders prefixed with a dot inside the user dir).
mail_location = maildir:/var/mail/vhosts/%d/%n/

namespace inbox {
  inbox = yes
  separator = /
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

mail_plugins = $mail_plugins quota
