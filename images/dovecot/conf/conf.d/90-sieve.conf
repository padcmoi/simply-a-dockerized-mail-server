plugin {
  sieve         = file:~/sieve;active=~/.dovecot.sieve
  sieve_default = /var/lib/dovecot/sieve/global/default.sieve
  # spam-to-junk MUST run BEFORE the user script: an AUTOROUTER rule (or any
  # user-crafted fileinto on the From: address) ends with `stop;` and would
  # short-circuit sieve_after. Put X-Spam-Flag routing in sieve_before so a
  # flagged sender always lands in Junk even when the user already has an
  # auto-route rule for them in their own folder.
  sieve_before  = /var/lib/dovecot/sieve/global/spam-to-junk.sieve
  sieve_extensions = +editheader +relational +comparator-i;ascii-numeric

  # Plugins enabling: imap_sieve (event triggers on IMAP actions) and
  # sieve_extprograms (allow calling an external binary from sieve via :pipe).
  sieve_plugins = sieve_imapsieve sieve_extprograms

  # Whitelist directory for sieve :pipe binaries.
  sieve_pipe_bin_dir = /usr/local/lib/dovecot/sieve

  sieve_global_extensions = +vnd.dovecot.pipe +vnd.dovecot.environment

  # Trigger 1: when a message is copied or moved INTO Junk, feed it to
  # sa-learn-pipe.sh as spam (learn_spam + INCR spam_count Redis counter).
  # In dovecot 2.3 / pigeonhole 0.5, the only valid causes are COPY APPEND
  # FLAG. Internally an IMAP MOVE (RFC 6851) is implemented as COPY+EXPUNGE
  # so the COPY cause catches the modern MOVE too.
  imapsieve_mailbox1_name   = Junk
  imapsieve_mailbox1_causes = COPY APPEND
  imapsieve_mailbox1_before = file:/var/lib/dovecot/sieve/global/learn-spam.sieve

  # Trigger 2: when a message is moved OUT of Junk (anywhere else), feed it
  # to sa-learn-pipe.sh as ham (learn_ham + DEL spam_count Redis counter).
  imapsieve_mailbox2_name   = *
  imapsieve_mailbox2_from   = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/var/lib/dovecot/sieve/global/learn-ham.sieve

  # Trigger 3: when a message is moved from INBOX into a user-created folder
  # (anything not Drafts/Sent/Junk/Trash/Archives), upsert a fileinto rule in
  # the user's managesieve script so future mail from the same sender lands
  # directly in that folder. The destination filter is done inside the sieve
  # script itself; the trigger only narrows source = INBOX and cause = COPY
  # (which catches both classic IMAP COPY+EXPUNGE clients and modern MOVE).
  imapsieve_mailbox3_name   = *
  imapsieve_mailbox3_from   = INBOX
  imapsieve_mailbox3_causes = COPY
  imapsieve_mailbox3_before = file:/var/lib/dovecot/sieve/global/auto-route.sieve

  # Trigger 4: when a message is moved BACK to INBOX from any other folder,
  # delete the matching AUTOROUTER rule (if any) for that sender from the
  # user's managesieve script. The point is to give clients that have no
  # Filters UI (mobile IMAP apps, native macOS Mail, ...) a way to remove
  # an auto-routing rule by simply dragging an offending mail back to the
  # inbox. Only the AUTOROUTER-named entry is touched; hand-crafted rules
  # with the same effect (e.g. a user-named "test123") are never modified.
  imapsieve_mailbox4_name   = INBOX
  imapsieve_mailbox4_from   = *
  imapsieve_mailbox4_causes = COPY
  imapsieve_mailbox4_before = file:/var/lib/dovecot/sieve/global/auto-route-undo.sieve

  sieve_max_script_size   = 1M
  sieve_quota_max_scripts = 5
  sieve_quota_max_storage = 1M
}
