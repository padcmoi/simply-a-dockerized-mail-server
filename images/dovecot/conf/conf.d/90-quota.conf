# =============================================================================
# Quota driver: dict-SQL backed by VirtualQuotaUsers.
#
# Every LMTP delivery / IMAP expunge updates the BDD counters live, so the
# database is the single source of truth (parity with v1 production).
# VirtualQuotaDomains aggregates are maintained by MariaDB triggers.
# =============================================================================

# Named dict goes through the dict-server proxy: dovecot's main process spawns
# a dict worker that talks to MariaDB on behalf of every LMTP / IMAP process.
dict {
  sqlquota = mysql:/etc/dovecot/dovecot-dict-sql-quota.conf.ext
}

plugin {
  quota = dict:User quota::proxy::sqlquota
  quota_grace = 10%%
}

service quota-warning {
  executable = script /usr/local/bin/quota-warning.sh
  unix_listener quota-warning {
    user = vmail
  }
}
