name: Mail server test suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: manager-api · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manager-api
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: manager-api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck-api:
    name: manager-api · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manager-api
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: manager-api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  test-api:
    name: manager-api · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: manager-api
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: manager-api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test (with coverage)
        run: pnpm test:cov

  lint-ui:
    name: manager-ui · lint
    needs: [lint-api, typecheck-api, test-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manager-ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: manager-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Nuxt
        run: pnpm nuxt prepare
      - name: Lint
        run: pnpm lint

  typecheck-ui:
    name: manager-ui · typecheck
    needs: [lint-api, typecheck-api, test-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: manager-ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: manager-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Nuxt
        run: pnpm nuxt prepare
      - name: Typecheck
        run: pnpm typecheck

  test-ui:
    name: manager-ui · test
    needs: [lint-api, typecheck-api, test-api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: manager-ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: manager-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  test-mailserver:
    name: ./test-mailservers.sh
    needs: [lint-ui, typecheck-ui, test-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIL_FQDN: mail.example.com
      PRIMARY_DOMAIN: example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Pin mail FQDN to loopback
        run: echo "127.0.0.1 ${MAIL_FQDN}" | sudo tee -a /etc/hosts

      - name: Generate a self-signed TLS cert for ${{ env.MAIL_FQDN }}
        run: |
          set -euo pipefail
          sudo mkdir -p "/tmp/letsencrypt/live/${MAIL_FQDN}"
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout "/tmp/letsencrypt/live/${MAIL_FQDN}/privkey.pem" \
            -out    "/tmp/letsencrypt/live/${MAIL_FQDN}/fullchain.pem" \
            -subj   "/CN=${MAIL_FQDN}" \
            -addext "subjectAltName=DNS:${MAIL_FQDN}"
          sudo chmod 0755 /tmp/letsencrypt /tmp/letsencrypt/live "/tmp/letsencrypt/live/${MAIL_FQDN}"
          sudo chmod 0644 "/tmp/letsencrypt/live/${MAIL_FQDN}"/*.pem

      - name: Render .env from .env.sample with CI defaults
        run: |
          set -euo pipefail
          rand() { openssl rand -hex 16; }
          randb64() { openssl rand -base64 48 | tr -d '\n/+=' | head -c 32; }
          cp .env.sample .env
          # CI-friendly values: loopback IP, self-signed cert path, random secrets.
          sed -i "s|^MAIL_HOSTNAME=.*|MAIL_HOSTNAME=${MAIL_FQDN}|"                    .env
          sed -i "s|^MAIL_PUBLIC_IP=.*|MAIL_PUBLIC_IP=127.0.0.1|"                     .env
          sed -i "s|^TLS_CERT_NAME=.*|TLS_CERT_NAME=${MAIL_FQDN}|"                    .env
          sed -i "s|^TLS_LETSENCRYPT_PATH=.*|TLS_LETSENCRYPT_PATH=/tmp/letsencrypt|"  .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(rand)|"                             .env
          sed -i "s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=$(rand)|"                   .env
          sed -i "s|^RSPAMD_PASSWORD=.*|RSPAMD_PASSWORD=$(rand)|"                     .env
          sed -i "s|^MANAGER_JWT_ACCESS_SECRET=.*|MANAGER_JWT_ACCESS_SECRET=$(randb64)|"   .env
          sed -i "s|^MANAGER_JWT_REFRESH_SECRET=.*|MANAGER_JWT_REFRESH_SECRET=$(randb64)|" .env

      - name: Bring stack up
        run: docker compose up -d --build

      - name: Wait for TypeORM schema (max 180s)
        run: |
          set -euo pipefail
          DB_ROOT=$(grep ^DB_ROOT_PASSWORD .env | cut -d= -f2)
          DB_NAME=$(grep ^DB_NAME .env | cut -d= -f2)
          # Wait on account_profiles, not accounts: accounts exists from an early
          # migration (still carrying `username`), while account_profiles is
          # created right before the migration that finalises the accounts schema
          # (drops username, makes email NOT NULL). Its presence means the seed
          # will hit the final email-identity schema.
          for i in $(seq 1 180); do
            if docker compose exec -T mariadb mariadb -uroot -p"$DB_ROOT" "$DB_NAME" \
                 -e "SHOW TABLES LIKE 'account_profiles'" 2>/dev/null | grep -q account_profiles; then
              echo "schema ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "schema never became ready"; exit 1

      - name: Seed admin account + primary domain + reserve postmaster
        run: |
          set -euo pipefail
          DB_ROOT=$(grep ^DB_ROOT_PASSWORD .env | cut -d= -f2)
          DB_NAME=$(grep ^DB_NAME .env | cut -d= -f2)
          # The admin email/password are no longer stored in .env (install.sh
          # prompts them at runtime and keeps them only in memory), so CI mints
          # its own here. The account is seeded by email, not a username.
          ADMIN_EMAIL="admin@${PRIMARY_DOMAIN}"
          ADMIN_PASS=$(openssl rand -hex 16)
          ADMIN_HASH=$(docker compose exec -T -e P="$ADMIN_PASS" manager-api node -e '
          const { randomBytes, scryptSync } = require("crypto");
          const N = 16384, r = 8, p = 1, salt = randomBytes(16);
          const dk = scryptSync(process.env.P, salt, 64, { N, r, p, maxmem: 67108864 });
          process.stdout.write(`scrypt$${N}$${r}$${p}$${salt.toString("base64")}$${dk.toString("base64")}`);
          ' | tr -d '\r')
          POSTMASTER_HASH=$(openssl passwd -6 -salt "$(openssl rand -hex 8)" "$(openssl rand -hex 16)")
          # The statements live in ci/seed.sql. Only their inputs are produced
          # here, and they travel as session variables rather than being pasted
          # into SQL literals: a scrypt hash is full of `$` and `/`, and a
          # here-doc that interpolates it is one bad character away from a
          # syntax error nobody sees until CI turns red.
          {
            printf "SET @admin_email='%s', @admin_hash='%s', @primary_domain='%s', @postmaster_hash='%s';\n" \
              "$ADMIN_EMAIL" "$ADMIN_HASH" "$PRIMARY_DOMAIN" "$POSTMASTER_HASH"
            cat ci/seed.sql
          } | docker compose exec -T mariadb mariadb -uroot -p"$DB_ROOT" "$DB_NAME"

      - name: Generate DKIM key for ${{ env.PRIMARY_DOMAIN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker compose exec -T opendkim curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose exec -T opendkim curl -fsS -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            "http://localhost:8080/keys/${PRIMARY_DOMAIN}" >/dev/null

      - name: Run ./test-mailservers.sh
        id: tests
        run: ./test-mailservers.sh

      - name: Upload test report + raw log (always)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            test-results.md
            test.log
          if-no-files-found: warn

      - name: Capture docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > docker-compose.log || true

      - name: Upload docker-compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: ignore

      - name: Tear stack down
        if: always()
        run: docker compose down -v --remove-orphans || true
