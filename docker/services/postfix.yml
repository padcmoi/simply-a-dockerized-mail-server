services:
  postfix:
    container_name: mail-postfix
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ../../images/postfix
    env_file: ../../.env
    volumes:
      - ${VOLUMES_PATH}/postfix-spool:/var/spool/postfix
      - ${VOLUMES_PATH}/log:/var/log/mail
      - ${TLS_LETSENCRYPT_PATH}:/etc/letsencrypt:ro
      - ${VOLUMES_PATH}/postfix-managed/settings:/var/lib/postfix-managed/settings:ro
      - ${VOLUMES_PATH}/postfix-managed/status:/var/lib/postfix-managed/status
    networks:
      mail:
        ipv4_address: 172.200.0.17
    dns:
      - 172.200.0.9
    depends_on:
      unbound:
        condition: service_started
      mariadb:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      opendkim:
        condition: service_started
      opendmarc:
        condition: service_started
      rspamd:
        condition: service_started
    ports:
      - "${BINDING_IP_SMTP}:${BINDING_PORT_SMTP}:25"
      - "${BINDING_IP_SMTPS}:${BINDING_PORT_SMTPS}:465"
      - "${BINDING_IP_SUBMISSION}:${BINDING_PORT_SUBMISSION}:587"
