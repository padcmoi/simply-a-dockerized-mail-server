services:
  manager-api:
    container_name: mail-manager-api
    restart: unless-stopped
    build:
      context: ../../manager-api
      dockerfile: Dockerfile.dev
    env_file: ../../.env
    environment:
      DB_HOST: mail-mariadb
      DB_PORT: 3306
      NODE_ENV: development
      OPENDKIM_API_URL: http://mail-opendkim:8080
      MAIL_VOLUME_PATH: /var/mail
    volumes:
      - ${VOLUMES_PATH}/mail:/var/mail:ro
      - ../../manager-api/src:/app/src
    networks:
      mail:
        ipv4_address: 172.200.0.19
    depends_on:
      mariadb:
        condition: service_healthy
