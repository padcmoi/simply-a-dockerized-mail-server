name: simply-mailserver

x-restart: &restart
  restart: unless-stopped

networks:
  mail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.200.0.0/24

volumes:
  redis_data:

services:
  mariadb:
    <<: *restart
    container_name: mail-mariadb
    build:
      context: ./images/mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/mysql:/var/lib/mysql
    networks:
      mail:
        ipv4_address: 172.200.0.10
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    <<: *restart
    container_name: mail-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      mail:
        ipv4_address: 172.200.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    <<: *restart
    container_name: mail-clamav
    build:
      context: ./images/clamav
    volumes:
      - ${VOLUMES_PATH}/clamav:/var/lib/clamav
    networks:
      mail:
        ipv4_address: 172.200.0.12
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

  opendkim:
    <<: *restart
    container_name: mail-opendkim
    build:
      context: ./images/opendkim
    env_file: .env
    volumes:
      - ${VOLUMES_PATH}/opendkim:/etc/opendkim
    networks:
      mail:
        ipv4_address: 172.200.0.13
    depends_on:
      mariadb:
        condition: service_healthy

  opendmarc:
    <<: *restart
    container_name: mail-opendmarc
    build:
      context: ./images/opendmarc
    env_file: .env
    volumes:
      - ${VOLUMES_PATH}/opendmarc:/var/lib/opendmarc
    networks:
      mail:
        ipv4_address: 172.200.0.14
    depends_on:
      mariadb:
        condition: service_healthy

  rspamd:
    <<: *restart
    container_name: mail-rspamd
    build:
      context: ./images/rspamd
    env_file: .env
    volumes:
      - ${VOLUMES_PATH}/rspamd:/var/lib/rspamd
    networks:
      mail:
        ipv4_address: 172.200.0.15
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "${BINDING_IP_RSPAMD_UI}:${BINDING_PORT_RSPAMD_UI}:11334"

  dovecot:
    <<: *restart
    container_name: mail-dovecot
    build:
      context: ./images/dovecot
    env_file: .env
    volumes:
      - ${VOLUMES_PATH}/mail:/var/mail
      - ${VOLUMES_PATH}/log:/var/log/mail
      - ${TLS_LETSENCRYPT_PATH}:/etc/letsencrypt:ro
    networks:
      mail:
        ipv4_address: 172.200.0.16
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${BINDING_IP_IMAPS}:${BINDING_PORT_IMAPS}:993"
    healthcheck:
      test: ["CMD-SHELL", "doveadm service status | grep -q imap-login && doveadm service status | grep -q lmtp"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postfix:
    <<: *restart
    container_name: mail-postfix
    build:
      context: ./images/postfix
    env_file: .env
    volumes:
      - ${VOLUMES_PATH}/postfix-spool:/var/spool/postfix
      - ${VOLUMES_PATH}/log:/var/log/mail
      - ${TLS_LETSENCRYPT_PATH}:/etc/letsencrypt:ro
    networks:
      mail:
        ipv4_address: 172.200.0.17
    depends_on:
      mariadb:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      opendkim:
        condition: service_started
      opendmarc:
        condition: service_started
      rspamd:
        condition: service_started
    ports:
      - "${BINDING_IP_SMTP}:${BINDING_PORT_SMTP}:25"
      - "${BINDING_IP_SMTPS}:${BINDING_PORT_SMTPS}:465"
      - "${BINDING_IP_SUBMISSION}:${BINDING_PORT_SUBMISSION}:587"

  fail2ban:
    <<: *restart
    container_name: mail-fail2ban
    build:
      context: ./images/fail2ban
    env_file: .env
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${VOLUMES_PATH}/log:/var/log/mail:ro
      - ${VOLUMES_PATH}/fail2ban:/var/lib/fail2ban

  phpmyadmin:
    <<: *restart
    container_name: mail-phpmyadmin
    image: phpmyadmin:5.2.1-apache
    environment:
      PMA_HOST: mail-mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
    networks:
      mail:
        ipv4_address: 172.200.0.21
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${BINDING_IP_PHPMYADMIN}:${BINDING_PORT_PHPMYADMIN}:80"

  roundcube:
    <<: *restart
    container_name: mail-roundcube
    image: roundcube/roundcubemail:1.6.10-apache
    environment:
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: mail-mariadb
      ROUNDCUBEMAIL_DB_USER: ${DB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD: ${DB_PASSWORD}
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail-dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail-postfix
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve,markasjunk
      ROUNDCUBE_LANGUAGE: ${ROUNDCUBE_LANGUAGE}
    volumes:
      - ./images/roundcube/config:/var/roundcube/config:ro
    networks:
      mail:
        ipv4_address: 172.200.0.18
    depends_on:
      mariadb:
        condition: service_healthy
      dovecot:
        condition: service_healthy
    ports:
      - "${BINDING_IP_ROUNDCUBE}:${BINDING_PORT_ROUNDCUBE}:80"

  manager-api:
    <<: *restart
    container_name: mail-manager-api
    build:
      context: ./manager-api
    env_file: .env
    environment:
      DB_HOST: mail-mariadb
      DB_PORT: 3306
      NODE_ENV: production
      OPENDKIM_API_URL: http://mail-opendkim:8080
    networks:
      mail:
        ipv4_address: 172.200.0.19
    depends_on:
      mariadb:
        condition: service_healthy

  manager-ui:
    <<: *restart
    container_name: mail-manager-ui
    build:
      context: ./manager-ui
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_PROXY_TARGET: http://manager-api:3000
      NODE_ENV: production
    networks:
      mail:
        ipv4_address: 172.200.0.20
    depends_on:
      - manager-api
    ports:
      - "${BINDING_IP_MANAGEUI}:${BINDING_PORT_MANAGEUI}:3000"
